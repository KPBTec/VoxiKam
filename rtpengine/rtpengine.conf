[rtpengine]
table               = 0
interface           = priv/__PRIVATE_IP__;pub/__PUBLIC_IP__
listen-ng           = 127.0.0.1:2223
listen-cli          = 127.0.0.1:9901
port-min            = 20000
port-max            = 40000
log-level           = 4
# LOCAL1, no LOCAL0 — Kamailio ya usa LOCAL0 (log_facility=LOG_LOCAL0 en
# kamailio.cfg.j2); con la misma facility, rsyslog mandaba ambos a
# /var/log/kamailio.log mezclados. rsyslog (40-kamailio.conf/41-rtpengine.conf,
# ver deploy.sh) separa LOCAL1 → /var/log/rtpengine.log, con logrotate diario
# (rotate 1, solo el día actual). Cambiar esto NO reinicia rtpengine solo —
# hace falta `systemctl restart rtpengine` a mano (ventana de mantenimiento,
# corta audio en curso) para que tome efecto.
log-facility        = local1

# Performance tuning v2.0
num-threads         = 0       # 0 = auto-detect CPU cores
receive-buffer-size = 4194304 # 4 MB — previene drops en bursts de RTP
#max-sessions        = 500    # NUNCA descomentar en producción: este cap causó
                               # 2306 rechazos en 5.5 minutos (ver CLAUDE.md).
                               # Sin límite explícito — el límite real es RAM/FDs.
timeout             = 60      # segundos sin RTP antes de liberar stream
silent-timeout      = 3600    # streams con RTP unidireccional (hold music)

# Calidad de medio (jitter/packet loss) → backend/hep_listener.py, mismo puerto
# que ya recibe HEP3 de Kamailio (proto_type los distingue: 1=SIP, 5=RTCP-JSON).
# Escribir esto NO reinicia rtpengine solo — deploy.sh nunca lo hace por su
# cuenta (corta audio de llamadas activas) — hace falta `systemctl restart
# rtpengine` a mano, en ventana de mantenimiento, para que tome efecto.
homer               = 127.0.0.1:9060
homer-protocol      = udp
homer-id            = 1
