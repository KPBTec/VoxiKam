<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Manual de uso de VoxiKam — guía paso a paso con capturas reales del panel admin, portal cliente y portal reseller.">
<title>Manual de uso — VoxiKam</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2316110c'/><text y='.72em' x='.14em' font-size='60'>⚡</text></svg>">
<script>
(function () {
  try {
    var t = localStorage.getItem('voxikam_theme');
    if (t && t !== 'bronce') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="custom.css?v=4">
</head>
<body>
<div id="app">Cargando el manual…</div>

<script>
window.$docsify = {
  name: 'VoxiKam · Manual',
  repo: '',
  loadSidebar: true,
  loadNavbar: false,
  subMaxLevel: 2,
  auto2top: true,
  homepage: 'README.md',
  coverpage: false,
  search: {
    maxAge: 0,
    placeholder: 'Buscar en el manual…',
    noData: 'Sin resultados.',
    depth: 3,
  },
  pagination: {
    previousText: 'Anterior',
    nextText: 'Siguiente',
    crossChapter: true,
    crossChapterText: true,
  },
  formatUpdated: false,
  plugins: [
    // El scrollspy interno de docsify a veces no sincroniza el resaltado de
    // la sidebar con el "?id=" de la URL al entrar por link directo/recarga
    // — se queda marcada la sub-sección anterior (visto en vivo: capítulo 11,
    // sub-sección 11.9 quedaba con "11.8 Logs" resaltado). Corrección puntual:
    // justo después de cada render, si la URL trae un id, forzar que ESE
    // link quede activo. No toca el resaltado por scroll normal (eso ya
    // funciona bien con el comportamiento por defecto de docsify).
    function (hook) {
      function fixActiveLink() {
        var match = location.hash.match(/[?&]id=([^&]+)/);
        if (!match) return;
        var id = decodeURIComponent(match[1]);
        var links = document.querySelectorAll('.sidebar-nav a');
        links.forEach(function (a) {
          var href = a.getAttribute('href') || '';
          if (href.indexOf('?id=') === -1) return; // no tocar los links de página completa
          a.parentElement.classList.toggle('active', href.indexOf('id=' + id) !== -1);
        });
      }
      hook.doneEach(function () {
        // docsify sigue recalculando el resaltado por su cuenta durante un
        // rato tras cada render (webfonts + imágenes asentando el layout),
        // y una corrección única queda pisada por la siguiente pasada suya.
        // Reafirmar varias veces durante ~3s hasta que todo se estabilice.
        var ticks = [50, 200, 500, 900, 1400, 2000, 2700, 3500];
        ticks.forEach(function (ms) { setTimeout(fixActiveLink, ms); });
      });
    },
  ],
};
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
<script>
// Lightbox de imágenes — click en cualquier captura del manual la abre en
// grande, con botón × y cierre por click-afuera/Escape. Delegado en
// `document` (no en las imágenes directamente) porque docsify reemplaza el
// contenido de .markdown-section en cada navegación — un listener atado a
// un <img> puntual se perdería en la siguiente página.
(function () {
  function closeLightbox() {
    var ov = document.querySelector('.img-lightbox-overlay');
    if (!ov) return;
    ov.remove();
    document.body.style.overflow = '';
    document.removeEventListener('keydown', onKeydown);
  }
  function onKeydown(e) {
    if (e.key === 'Escape') closeLightbox();
  }
  document.addEventListener('click', function (e) {
    var overlay = e.target.closest('.img-lightbox-overlay');
    if (overlay) { closeLightbox(); return; }

    var img = e.target.closest('.markdown-section img');
    if (!img) return;

    var ov = document.createElement('div');
    ov.className = 'img-lightbox-overlay';
    var big = document.createElement('img');
    big.src = img.src;
    big.alt = img.alt || '';
    var closeBtn = document.createElement('button');
    closeBtn.className = 'img-lightbox-close';
    closeBtn.setAttribute('aria-label', 'Cerrar');
    closeBtn.innerHTML = '&times;';
    ov.appendChild(big);
    ov.appendChild(closeBtn);
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    document.addEventListener('keydown', onKeydown);
  });
})();
</script>
</body>
</html>
