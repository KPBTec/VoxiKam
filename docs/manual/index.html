<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Manual de uso de VoxiKam — guía paso a paso con capturas reales del panel admin, portal cliente y portal reseller.">
<title>Manual de uso — VoxiKam</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2316110c'/><text y='.72em' x='.14em' font-size='60'>⚡</text></svg>">
<link rel="stylesheet" href="custom.css?v=2">
</head>
<body>
<div id="app">Cargando el manual…</div>

<script>
window.$docsify = {
  name: 'VoxiKam · Manual',
  repo: '',
  loadSidebar: true,
  loadNavbar: false,
  subMaxLevel: 2,
  auto2top: true,
  homepage: 'README.md',
  coverpage: false,
  search: {
    maxAge: 0,
    placeholder: 'Buscar en el manual…',
    noData: 'Sin resultados.',
    depth: 3,
  },
  pagination: {
    previousText: 'Anterior',
    nextText: 'Siguiente',
    crossChapter: true,
    crossChapterText: true,
  },
  formatUpdated: false,
};
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
<script>
// Lightbox de imágenes — click en cualquier captura del manual la abre en
// grande, con botón × y cierre por click-afuera/Escape. Delegado en
// `document` (no en las imágenes directamente) porque docsify reemplaza el
// contenido de .markdown-section en cada navegación — un listener atado a
// un <img> puntual se perdería en la siguiente página.
(function () {
  function closeLightbox() {
    var ov = document.querySelector('.img-lightbox-overlay');
    if (!ov) return;
    ov.remove();
    document.body.style.overflow = '';
    document.removeEventListener('keydown', onKeydown);
  }
  function onKeydown(e) {
    if (e.key === 'Escape') closeLightbox();
  }
  document.addEventListener('click', function (e) {
    var overlay = e.target.closest('.img-lightbox-overlay');
    if (overlay) { closeLightbox(); return; }

    var img = e.target.closest('.markdown-section img');
    if (!img) return;

    var ov = document.createElement('div');
    ov.className = 'img-lightbox-overlay';
    var big = document.createElement('img');
    big.src = img.src;
    big.alt = img.alt || '';
    var closeBtn = document.createElement('button');
    closeBtn.className = 'img-lightbox-close';
    closeBtn.setAttribute('aria-label', 'Cerrar');
    closeBtn.innerHTML = '&times;';
    ov.appendChild(big);
    ov.appendChild(closeBtn);
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    document.addEventListener('keydown', onKeydown);
  });
})();
</script>
</body>
</html>
