# VoxiKam — filtro para rechazos de seguridad del backend (login fallido,
# User-Agent de scanner). Copiado por deploy.sh a
# /etc/fail2ban/filter.d/voxikam-security.conf
#
# Solo matchea reason=blocked_ua / login_failed — señales que un usuario
# legítimo nunca dispara. A propósito NO incluye el rate-limit de /api/ (429):
# un cliente de alto tráfico normal puede tocarlo sin ser un ataque, banear
# por eso sería un auto-DoS (mismo criterio que VoxiDet).
[Definition]
failregex = ^.*SECURITY_REJECT ip=<HOST> reason=(blocked_ua|login_failed)\b
ignoreregex =
