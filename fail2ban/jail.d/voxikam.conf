# VoxiKam — jails de fail2ban (plantilla). Copiado por deploy.sh a
# /etc/fail2ban/jail.d/voxikam.conf, sustituyendo el puerto SSH (sed).
#
# NO editar el archivo en /etc directamente.

[DEFAULT]
# nftables, no iptables — el proyecto ya usa nftables para el firewall
# (nftables/nftables.conf). fail2ban con banaction=nftables-* crea su propio
# set independiente y no toca la tabla `filter` ni las reglas de
# carriers/customers generadas por gen_nftables.py.
banaction          = nftables-allports
banaction_allports = nftables-allports

[sshd]
# Jail estándar de fail2ban — puerto personalizado (mismo detectado que usa
# nftables.conf) y backend forzado a systemd: backend=auto falla en
# Debian/Ubuntu moderno cuando no existe /var/log/auth.log (todo va a
# journald) — "Have not found any log file for sshd jail".
enabled      = true
port         = __SSH_PORT__
backend      = systemd
journalmatch = _SYSTEMD_UNIT=__SSH_SERVICE__
maxretry     = 5
findtime     = 600
bantime      = 3600

[voxikam-security]
# voxikam-backend loguea a journald (StandardOutput=journal en el .service),
# no a un archivo — se lee directo del journal, sin logpath.
enabled      = true
filter       = voxikam-security
backend      = systemd
journalmatch = SYSLOG_IDENTIFIER=voxikam-backend
maxretry     = 10
findtime     = 60
bantime      = 3600
