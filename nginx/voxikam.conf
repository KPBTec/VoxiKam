# KPBTec VoxiKam — Nginx config
# Los __PLACEHOLDER__ son reemplazados por install.sh via sed
# NO editar directamente en producción — editar este archivo y reinstalar

limit_req_zone  $binary_remote_addr zone=api_limit:10m   rate=60r/m;
limit_req_zone  $binary_remote_addr zone=login_limit:2m  rate=5r/m;
# Tráfico de integraciones de clientes (/api/v1, autenticado con API key, no
# JWT) — techo más alto que el navegador y sigue siendo por IP acá (nginx no
# inspecciona el header X-API-Key para el zone key sin más trabajo); el límite
# fino por key vive en backend/middleware/security.py, esto es solo el piso
# anti-DoS.
limit_req_zone  $binary_remote_addr zone=api_v1_limit:10m rate=200r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen __WEB_PORT__;
    server_name __DOMAIN__;

    access_log /var/log/nginx/voxikam.access.log combined buffer=16k;
    error_log  /var/log/nginx/voxikam.error.log warn;

    client_max_body_size  10M;
    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          60s;
    keepalive_timeout     65s;
    server_tokens         off;

    limit_conn conn_limit 50;

    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "DENY"             always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
    # CSP va acá (nginx), no solo en backend/middleware/security.py — ese
    # middleware corre en FastAPI (puerto 8000, solo /api/*), pero location /
    # (el HTML real que carga el navegador) la sirve Next.js en el puerto
    # 3000 y nunca pasaba por ahí. Sin esto, el CSP no protegía ni una sola
    # página del panel, solo respuestas JSON donde no tiene ningún efecto
    # (el navegador solo aplica CSP contra el documento que la trae puesta).
    # 'unsafe-eval' se sacó — confirmado con grep contra el bundle de
    # producción real (frontend/.next/static/chunks/*.js) que no lo usa.
    # 'unsafe-inline' se mantiene en script-src (dato de hidratación inline
    # de Next.js) y en style-src (estilos inline de React ya existentes en
    # el código) — sacarlos requiere CSP con nonce por request, cambio más
    # grande, no se hizo en esta pasada.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Rate limit estricto en login (anti brute-force)
    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    # API pública de clientes (X-API-Key) — techo dedicado, no compite con el
    # tráfico del navegador (login/dashboard) del balde /api/ general.
    location /api/v1/ {
        limit_req zone=api_v1_limit burst=40 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    # Assets estáticos Next.js servidos directo desde disco (sin pasar por Node.js)
    location /_next/static/ {
        alias __INSTALL_DIR__/frontend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 60s;
    }

    # Bloquear archivos sensibles
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }
}
